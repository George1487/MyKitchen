syntax = "proto3";

package mykitchen.partner.v1;

option go_package = "MyKitchen/gen/partner/v1;partnerv1";

import "google/protobuf/empty.proto";

service PartnerService {
  rpc RegisterRestaurant(RegisterRestaurantRequest) returns (RegisterRestaurantResponse);
  rpc CreateMenuItem(CreateMenuItemRequest) returns (CreateMenuItemResponse);
  rpc SetAcceptingOrders(SetAcceptingOrdersRequest) returns (google.protobuf.Empty);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc ChangeOrderStatus(ChangeOrderStatusRequest) returns (google.protobuf.Empty);
}

message RegisterRestaurantRequest {
  string name = 1;
  string phone = 2;
  string address = 3;
  string opening_time = 4;
  string closing_time = 5;
}

message RegisterRestaurantResponse {
  int64 restaurant_id = 1;
}

message CreateMenuItemRequest {
  int64 restaurant_id = 1;
  string name = 2;
  string description = 3;
  int64 price = 4;
  bool is_available = 5;
  int64 available_quantity = 6;
}

message CreateMenuItemResponse {
  int64 menu_item_id = 1;
}

message SetAcceptingOrdersRequest {
  int64 restaurant_id = 1;
  bool is_accepting_orders = 2;
}

message ListOrdersRequest {
  int64 restaurant_id = 1;
}

message OrderSummary {
  int64 order_id = 1;
  OrderStatus status = 2;
}

message ListOrdersResponse {
  repeated OrderSummary orders = 1;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_ACCEPTED = 2;
  ORDER_STATUS_CANCELLED = 3;
  ORDER_STATUS_DELIVERED = 4;
}

message ChangeOrderStatusRequest {
  int64 restaurant_id = 1;
  int64 order_id = 2;
  OrderStatus status = 3;
}
