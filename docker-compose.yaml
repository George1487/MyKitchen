name: mykitchen

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mykitchen}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    expose:
      - "9090"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-mykitchen}
      DB_SSLMODE: disable
      HTTP_LISTEN_ADDR: ":8080"
      GRPC_LISTEN_ADDR: ":9090"
      PARTNER_API_KEY: ${PARTNER_API_KEY:-local-partner-key}
    depends_on:
      db:
        condition: service_healthy

  restaurant-demo:
    build:
      context: .
      target: restaurant-demo
    environment:
      GRPC_ADDR: app:9090
      PARTNER_API_KEY: ${PARTNER_API_KEY:-local-partner-key}
      RESTAURANT_DECISION: ${RESTAURANT_DECISION:-accept}
      POLL_INTERVAL: 3s
    depends_on:
      app:
        condition: service_started
