openapi: 3.0.3
info:
  title: MyKitchen Customer API
  version: 1.0.0
  description: |
    Публичное API MVP для клиента: просмотр ресторанов и меню, создание заказа.
    Авторизация для этих маршрутов не требуется.
servers:
  - url: http://localhost:8080
    description: Локальный запуск через Docker Compose
tags:
  - name: Customer
    description: Операции, доступные клиентскому приложению
paths:
  /restaurants:
    get:
      tags: [Customer]
      summary: Получить список ресторанов
      operationId: getRestaurants
      responses:
        '200':
          description: Список ресторанов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
              example:
                - id: 1
                  name: Demo Kitchen
                  address: Москва, улица Пример, 10
                  phone: '+79990000000'
                  opening_time: '09:00'
                  closing_time: '23:00'
                  is_accepting_orders: true
        '500':
          $ref: '#/components/responses/InternalServerError'

  /restaurants/{id}:
    get:
      tags: [Customer]
      summary: Получить ресторан по идентификатору
      operationId: getRestaurantById
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Ресторан найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          description: Идентификатор ресторана некорректен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: некорректный идентификатор ресторана
        '404':
          description: Ресторан не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: ресторан не найден
        '500':
          $ref: '#/components/responses/InternalServerError'

  /restaurants/{id}/menu:
    get:
      tags: [Customer]
      summary: Получить меню ресторана
      operationId: getRestaurantMenu
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Список позиций меню. Остаток блюда не раскрывается клиенту.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
              example:
                - id: 1
                  name: Пицца Маргарита
                  description: Томатный соус и моцарелла
                  price: 500
                  is_available: true
        '400':
          description: Идентификатор ресторана некорректен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: некорректный идентификатор ресторана
        '404':
          description: Ресторан не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: ресторан не найден
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    post:
      tags: [Customer]
      summary: Создать заказ
      description: |
        Создаёт заказ в статусе `new`. В MVP доставка считается возможной,
        если поле `address` после удаления пробелов по краям не пустое.
        Перед созданием сервис проверяет, что ресторан принимает заказы,
        блюда принадлежат ему, доступны и имеются в достаточном количестве.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              client_id: 1
              restaurant_id: 1
              address: Москва, улица Пример, 10
              items:
                - menu_item_id: 1
                  quantity: 2
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 42
                restaurant_id: 1
                address: Москва, улица Пример, 10
                total_price: 1000
                status: new
                created_at: '2026-08-29T11:50:29Z'
                items:
                  - menu_item_id: 1
                    price: 500
                    quantity: 2
        '400':
          description: Тело запроса невалидно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: некорректные данные заказа
        '404':
          description: Ресторан или позиция меню не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: ресторан или позиция меню не найдены
        '409':
          description: |
            Заказ нельзя создать: ресторан не принимает заказы, блюдо относится
            к другому ресторану, недоступно или его недостаточно в наличии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: не удалось создать заказ

components:
  parameters:
    RestaurantId:
      name: id
      in: path
      required: true
      description: Положительный идентификатор ресторана
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: внутренняя ошибка сервера

  schemas:
    Restaurant:
      type: object
      required:
        - id
        - name
        - address
        - phone
        - opening_time
        - closing_time
        - is_accepting_orders
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Demo Kitchen
        address:
          type: string
          example: Москва, улица Пример, 10
        phone:
          type: string
          example: '+79990000000'
        opening_time:
          type: string
          example: '09:00'
        closing_time:
          type: string
          example: '23:00'
        is_accepting_orders:
          type: boolean
          description: Принимает ли ресторан новые заказы сейчас
          example: true

    MenuItem:
      type: object
      required:
        - id
        - name
        - description
        - price
        - is_available
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Пицца Маргарита
        description:
          type: string
          example: Томатный соус и моцарелла
        price:
          type: integer
          format: int64
          minimum: 0
          description: Цена блюда в единицах, принятых приложением
          example: 500
        is_available:
          type: boolean
          description: Доступна ли позиция для заказа
          example: true

    CreateOrderRequest:
      type: object
      required:
        - client_id
        - restaurant_id
        - address
        - items
      properties:
        client_id:
          type: integer
          format: int64
          minimum: 1
          description: Идентификатор клиента. В MVP передаётся клиентским приложением.
          example: 1
        restaurant_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        address:
          type: string
          minLength: 1
          description: Адрес доставки; непустой адрес считается доступным для доставки в MVP.
          example: Москва, улица Пример, 10
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'

    CreateOrderItem:
      type: object
      required:
        - menu_item_id
        - quantity
      properties:
        menu_item_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 2

    Order:
      type: object
      required:
        - id
        - restaurant_id
        - address
        - total_price
        - status
        - created_at
        - items
      properties:
        id:
          type: integer
          format: int64
          example: 42
        restaurant_id:
          type: integer
          format: int64
          example: 1
        address:
          type: string
          example: Москва, улица Пример, 10
        total_price:
          type: integer
          format: int64
          minimum: 0
          description: Итоговая стоимость заказа в единицах, принятых приложением
          example: 1000
        status:
          type: string
          enum: [new, accepted, cancelled, delivered]
          example: new
        created_at:
          type: string
          format: date-time
          example: '2026-08-29T11:50:29Z'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderItem:
      type: object
      required:
        - menu_item_id
        - price
        - quantity
      properties:
        menu_item_id:
          type: integer
          format: int64
          example: 1
        price:
          type: integer
          format: int64
          minimum: 0
          description: Цена одной позиции на момент создания заказа
          example: 500
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 2

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: некорректные данные заказа
